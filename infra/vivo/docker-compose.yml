# LiveKit + Redis para sala en vivo (red del host; óptimo para WebRTC según LiveKit).
# Señalización wss: termina TLS en Traefik (Coolify), no en este compose.
# No despliegues sin revisar docs/despliegue/vivo-vps.md.

name: jules-vivo

services:
  redis:
    image: redis:7.4.2-alpine
    network_mode: host
    restart: unless-stopped
    command:
      - redis-server
      - --bind
      - 127.0.0.1
      - --port
      - "6380"
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - allkeys-lru
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  livekit:
    image: livekit/livekit-server:v1.13.11
    network_mode: host
    restart: unless-stopped
    depends_on:
      - redis
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    environment:
      # LiveKit exige «clave: secreto», con el espacio tras los dos puntos.
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
      LIVEKIT_TURN_CERT: ${LIVEKIT_TURN_CERT:-}
      LIVEKIT_TURN_KEY: ${LIVEKIT_TURN_KEY:-}
    command: ["--config", "/etc/livekit.yaml"]
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 2048M
        reservations:
          cpus: "0.25"
          memory: 256M
    # Límites en Compose clásico (sin Swarm); el motor aplica el más restrictivo disponible.
    mem_limit: 2g
    cpus: 1.5

  emisor:
    build:
      context: ../..
      dockerfile: infra/vivo/Dockerfile.emisor
    restart: unless-stopped
    ports:
      - "127.0.0.1:5370:5370"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PUERTO: "5370"
      LIVEKIT_URL: ${LIVEKIT_URL:?Configura LIVEKIT_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?Configura LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?Configura LIVEKIT_API_SECRET}
      DEMO_ORIGEN: ${DEMO_ORIGEN:?Configura DEMO_ORIGEN}
      DEMO_LLAVE: ${DEMO_LLAVE:-}
      DEMO_CABECERA_IP: ${DEMO_CABECERA_IP:-}
      DEMO_MAX_SALAS: ${DEMO_MAX_SALAS:-10}
      DEMO_PASES_MINUTO: ${DEMO_PASES_MINUTO:-120}
      DEMO_INTENTOS_IP_MINUTO: ${DEMO_INTENTOS_IP_MINUTO:-30}
      DEMO_TOPE_SALA: ${DEMO_TOPE_SALA:-25}
      DEMO_TTL_PASE_SEGUNDOS: ${DEMO_TTL_PASE_SEGUNDOS:-300}
      DEMO_TTL_SALA_SEGUNDOS: ${DEMO_TTL_SALA_SEGUNDOS:-14400}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
          pids: 64
